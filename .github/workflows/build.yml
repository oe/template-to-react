name: build library

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 22
            react: 18
          - node: 22
            react: 19
          - node: 24
            react: 19
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - name: Check React 18 compatibility
        if: matrix.react == 18
        run: yarn add --dev --no-lockfile react@18.3.1 react-dom@18.3.1
      - run: yarn test:coverage
      - run: yarn build
      - run: yarn test:package
