name: build library

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node: 22
            react: 18
          - node: 22
            react: 19
          - node: 24
            react: 19
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check React 18 compatibility
        if: matrix.react == 18
        run: pnpm add --save-dev react@18.3.1 react-dom@18.3.1
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm test:package
